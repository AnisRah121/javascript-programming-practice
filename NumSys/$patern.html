<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let n = 'Enter a num'
        pattern(n)
        function pattern(n) {
            let str = ''
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= n; j++) {
                    str += '* '
                }
                str += '\n'
            }
            console.log(str);

        }

    </script>
</body>

</html>
